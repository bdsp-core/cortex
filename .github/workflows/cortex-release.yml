name: CORTEX Release Build

# Runs on macOS + Windows runners to build the standalone CORTEX
# test-taker apps via PyInstaller (cortex_app/cortex.spec), then
# attaches both to a new GitHub Release.
#
# Triggered by:
#   - pushing a tag like  cortex-v1.0,  cortex-v1.1,  cortex-v2.0
#   - manually via the Actions UI ("Run workflow")
#
# Build-time data dependency:
#   data/eeg_bank.h5 (~170 MB) is fetched from the repo's own
#   `build-data-v2` release using GITHUB_TOKEN (no external creds).
#   To refresh the bank: upload the new file to a new release tag
#   (build-data-v2, etc.) and bump the tag reference in the
#   "Download test bank" step below. No AWS interaction in CI.
#
# Required repository secret (Settings -> Secrets and variables ->
# Actions -> New repository secret):
#   CORTEX_CONFIG_YAML
#       -- the full contents of cortex_config.yaml (with Dropbox
#          app_key, app_secret, refresh_token filled in). CI writes
#          this to the repo root before the build.

on:
  push:
    tags:
      - 'cortex-v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage cortex_config.yaml from secret
        env:
          CORTEX_CONFIG_YAML: ${{ secrets.CORTEX_CONFIG_YAML }}
        run: |
          if [ -z "$CORTEX_CONFIG_YAML" ]; then
            echo "ERROR: secret CORTEX_CONFIG_YAML is not set"; exit 1
          fi
          printf '%s' "$CORTEX_CONFIG_YAML" > cortex_config.yaml

      - name: Download test bank from build-data release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download build-data-v3-k7 \
              --repo ${{ github.repository }} \
              --pattern eeg_bank.h5 \
              --dir data/

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cortex.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          cd cortex_app
          pyinstaller --clean --noconfirm cortex.spec

      - name: Create DMG (with /Applications drag-target)
        # The mounted DMG must show CORTEX.app AND an Applications
        # shortcut at the top level so users drag-install rather than
        # double-click in-place. Double-clicking inside the DMG triggers
        # macOS App Translocation — macOS runs the app from a read-only
        # temp copy and CACHES that copy by source-path hash, which
        # silently re-runs old code from later releases launched the
        # same way (and broke v1.0.7 for users who had v1.0 cached).
        run: |
          STAGING=cortex_app/dist/CORTEX-dmg-staging
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R cortex_app/dist/CORTEX.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "CORTEX" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            cortex_app/dist/CORTEX-mac.dmg
          rm -rf "$STAGING"

      - name: Upload Mac DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CORTEX-mac
          path: cortex_app/dist/CORTEX-mac.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage cortex_config.yaml from secret
        env:
          CORTEX_CONFIG_YAML: ${{ secrets.CORTEX_CONFIG_YAML }}
        shell: pwsh
        run: |
          if (-not $env:CORTEX_CONFIG_YAML) {
            Write-Error "secret CORTEX_CONFIG_YAML is not set"; exit 1
          }
          Set-Content -Path cortex_config.yaml -Value $env:CORTEX_CONFIG_YAML -NoNewline

      - name: Download test bank from build-data release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          gh release download build-data-v3-k7 `
              --repo ${{ github.repository }} `
              --pattern eeg_bank.h5 `
              --dir data/

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cortex.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          cd cortex_app
          pyinstaller --clean --noconfirm cortex.spec

      - name: Zip Windows build
        shell: pwsh
        run: Compress-Archive -Path cortex_app/dist/CORTEX -DestinationPath cortex_app/dist/CORTEX-windows.zip

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: CORTEX-windows
          path: cortex_app/dist/CORTEX-windows.zip

  build-linux:
    # Pin to ubuntu-22.04 (glibc 2.35) — NOT ubuntu-latest. PyInstaller
    # binaries are dynamically linked against the build machine's glibc;
    # the resulting binary requires glibc >= the build version on the
    # user's machine. 2.35 covers Ubuntu 22.04+, Debian 12+, Fedora 36+,
    # RHEL 9+, Arch (rolling). Building on a newer Ubuntu would break
    # users on those slightly-older distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt6 system libraries
        # PyQt6 wheels bundle Qt itself but link against host Xlib/xcb
        # libraries at runtime. PyInstaller copies what it can detect via
        # ldd into the bundle, but only if the libs are present on the
        # build host. This list is the standard "what does Qt 6 need on
        # Linux" set; safe to install all of them.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 \
            libfontconfig1 libdbus-1-3

      - name: Stage cortex_config.yaml from secret
        env:
          CORTEX_CONFIG_YAML: ${{ secrets.CORTEX_CONFIG_YAML }}
        run: |
          if [ -z "$CORTEX_CONFIG_YAML" ]; then
            echo "ERROR: secret CORTEX_CONFIG_YAML is not set"; exit 1
          fi
          printf '%s' "$CORTEX_CONFIG_YAML" > cortex_config.yaml

      - name: Download test bank from build-data release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download build-data-v3-k7 \
              --repo ${{ github.repository }} \
              --pattern eeg_bank.h5 \
              --dir data/

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cortex.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          cd cortex_app
          pyinstaller --clean --noconfirm cortex.spec

      - name: Tar Linux build
        # tar.gz mirrors the .zip / .dmg pattern of the other two runners.
        # Use a deterministic top-level "CORTEX/" so the user can extract
        # and immediately `./CORTEX/CORTEX` regardless of cwd.
        run: |
          cd cortex_app/dist
          tar czf CORTEX-linux-x86_64.tar.gz CORTEX

      - name: Upload Linux tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: CORTEX-linux
          path: cortex_app/dist/CORTEX-linux-x86_64.tar.gz

  release:
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/cortex-v')
    permissions:
      contents: write
    steps:
      - name: Download Mac artifact
        uses: actions/download-artifact@v4
        with:
          name: CORTEX-mac
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: CORTEX-windows
          path: artifacts/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: CORTEX-linux
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            artifacts/CORTEX-mac.dmg
            artifacts/CORTEX-windows.zip
            artifacts/CORTEX-linux-x86_64.tar.gz
          body: |
            ## CORTEX adaptive EEG certification test

            ### Hotfix in v1.2.1 (since v1.2.0)

            **Critical fix: v1.2.0 sessions never asked spike questions.** The v1.2.0 ship had the K=7 backbone fully wired EXCEPT for a leftover K=6 import in the live-test entry point (`scripts/eeg_bank_viewer.py:open_viewer`). As a result, v1.2.0 sessions ran with K=6 engine inputs (300 IIIC seg_ids only); the 50 spike segments in the bundled K=7 bank were never asked; the final certificate had 6 task verdicts and no spike verdict. v1.2.1 fixes the import to use `build_k7_engine_inputs` so all 7 tasks (spike + 6 IIIC) actually get tested. Also fixes a latent ℓ\* block-name mismatch between the policy and the results-screen loader.

            **If you took v1.2.0:** please retake v1.2.1 to get a spike verdict. Your v1.2.0 results are missing the spike task and are not directly comparable.

            Regression-gated by three new tests in `tests/test_cortex_viewer.py`; bundle suite is now 432/432 pass + 26/26 viewer pass.

            ### What's new in v1.2.0 (since v1.1.5)

            - **Now K=7** — the certification test now covers **7 tasks**: the original 6 IIIC pattern_classes (Seizure / LPD / GPD / LRDA / GRDA / Other) **plus a 7th spike-vs-no-spike task** (Phase 9 ground-up rebuild). Spike segments use the Jing-spike-paper presentation: 10-second window at 128 Hz with a Yes / No answer, alongside the unchanged 30-second IIIC presentation with 6-way answer.
            - **Sim-calibrated adaptive stop policy.** The engine now stops a task when it has confident evidence — sessions complete in ~190 trials median (was ~300 cap in v1.1.5). Borderline-skill raters still see longer sessions; confident-skill raters finish in ~110 trials. Calibration sweep + numbers: `docs/SIM_V1_2_0_REPORT.md` in the source repo.
            - **Result uploads are cohort-isolated.** v1.2.0 session CSVs land in `Dropbox/Apps/CORTEX/results/v1.2.0/` (was `Dropbox/Apps/CORTEX/results/` in v1.1.5). Same Dropbox app + credentials as v1.1.5 — no new login.
            - **Per-task verdicts** now include a Spike row alongside the 6 IIIC rows on the results screen.

            ### Downloads
            - **macOS:** `CORTEX-mac.dmg` — see "Opening CORTEX on macOS" below
            - **Windows:** `CORTEX-windows.zip` — see "Opening CORTEX on Windows" below
            - **Linux:** `CORTEX-linux-x86_64.tar.gz` — see "Opening CORTEX on Linux" below

            ### Opening CORTEX on macOS

            CORTEX is not Apple-signed (this is an internal pilot, not a commercial app), so the **first launch needs one-time approval**. On macOS Sequoia and later, Apple removed the inline "Open Anyway" button from the warning dialog — you have to authorize it from System Settings.

            **You MUST drag CORTEX to /Applications first — don't double-click it inside the disk-image window.** macOS quietly runs apps launched from a downloaded location in a read-only "translocated" copy and *caches* that copy, so a buggy old version can keep getting re-run even after you download a fixed update. Installing to /Applications avoids the whole class of problem.

            1. Double-click `CORTEX-mac.dmg` to open it. A window appears with **CORTEX** on the left and an **Applications** shortcut on the right.
            2. **Drag the CORTEX icon onto the Applications shortcut.** (Don't double-click CORTEX inside this window.)
            3. Eject the disk image (Finder → arrow next to "CORTEX" in the sidebar). Open **Applications**, double-click **CORTEX**.
            4. macOS shows *"CORTEX Not Opened — Apple could not verify CORTEX is free of malware..."* Click **Done**.
            5. Open **System Settings → Privacy & Security**. Scroll to the **Security** section near the bottom.
            6. You'll see *"CORTEX was blocked to protect your Mac."* Click **Open Anyway** (enter your password if prompted).
            7. Try opening **CORTEX** from /Applications again. This time you get a new dialog *with* an **Open** button — click **Open**.
            8. macOS remembers — no further warnings on subsequent launches.

            If you're comfortable with Terminal, this single command run after dragging to /Applications also works (skips steps 4–7):

            ```
            xattr -d com.apple.quarantine /Applications/CORTEX.app
            ```

            ### Opening CORTEX on Windows

            1. Extract the `.zip`, open the `CORTEX/` folder, double-click `CORTEX.exe`.
            2. If Windows SmartScreen warns *"Windows protected your PC"*, click **More info** then **Run anyway**. (Only the first launch.)

            ### Opening CORTEX on Linux

            1. Extract the tarball:

               ```
               tar xzf CORTEX-linux-x86_64.tar.gz
               ```

            2. Run the launcher:

               ```
               ./CORTEX/CORTEX
               ```

               (Or open the `CORTEX/` folder in your file manager and double-click the `CORTEX` executable — most desktop environments will run it as a binary on first double-click.)

            The Linux build is x86_64 only. The MP4 visualisation render requires `ffmpeg` on your `$PATH` — install with `sudo apt install ffmpeg` (Debian/Ubuntu), `sudo dnf install ffmpeg` (Fedora/RHEL), or `sudo pacman -S ffmpeg` (Arch). Without it, sessions still complete cleanly; the per-test-taker collapse / pass-fail videos won't be generated.

            ### Requirements

            macOS 12 (Monterey) or later, or Windows 10/11, or Linux with glibc 2.35+ (Ubuntu 22.04+, Debian 12+, Fedora 36+, RHEL 9+). No Python install needed — everything is bundled.

            ### Reporting bugs

            Anything that crashes, looks visually wrong, is confusing, or feels slow — note it and email the study team. That feedback is the whole point of this internal round.
          draft: false
          prerelease: false

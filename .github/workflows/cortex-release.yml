name: CORTEX Release Build

# Runs on macOS + Windows runners to build the standalone CORTEX
# test-taker apps via PyInstaller (cortex_app/cortex.spec), then
# attaches both to a new GitHub Release.
#
# Triggered by:
#   - pushing a tag like  cortex-v1.0,  cortex-v1.1,  cortex-v2.0
#   - manually via the Actions UI ("Run workflow")
#
# Build-time data dependency:
#   data/eeg_bank.h5 (~170 MB) is fetched from the repo's own
#   `build-data-v1` release using GITHUB_TOKEN (no external creds).
#   To refresh the bank: upload the new file to a new release tag
#   (build-data-v2, etc.) and bump the tag reference in the
#   "Download test bank" step below. No AWS interaction in CI.
#
# Required repository secret (Settings -> Secrets and variables ->
# Actions -> New repository secret):
#   CORTEX_CONFIG_YAML
#       -- the full contents of cortex_config.yaml (with Dropbox
#          app_key, app_secret, refresh_token filled in). CI writes
#          this to the repo root before the build.

on:
  push:
    tags:
      - 'cortex-v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage cortex_config.yaml from secret
        env:
          CORTEX_CONFIG_YAML: ${{ secrets.CORTEX_CONFIG_YAML }}
        run: |
          if [ -z "$CORTEX_CONFIG_YAML" ]; then
            echo "ERROR: secret CORTEX_CONFIG_YAML is not set"; exit 1
          fi
          printf '%s' "$CORTEX_CONFIG_YAML" > cortex_config.yaml

      - name: Download test bank from build-data release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download build-data-v1 \
              --repo ${{ github.repository }} \
              --pattern eeg_bank.h5 \
              --dir data/

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cortex.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          cd cortex_app
          pyinstaller --clean --noconfirm cortex.spec

      - name: Create DMG
        run: |
          hdiutil create -volname "CORTEX" \
            -srcfolder cortex_app/dist/CORTEX.app \
            -ov -format UDZO \
            cortex_app/dist/CORTEX-mac.dmg

      - name: Upload Mac DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CORTEX-mac
          path: cortex_app/dist/CORTEX-mac.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage cortex_config.yaml from secret
        env:
          CORTEX_CONFIG_YAML: ${{ secrets.CORTEX_CONFIG_YAML }}
        shell: pwsh
        run: |
          if (-not $env:CORTEX_CONFIG_YAML) {
            Write-Error "secret CORTEX_CONFIG_YAML is not set"; exit 1
          }
          Set-Content -Path cortex_config.yaml -Value $env:CORTEX_CONFIG_YAML -NoNewline

      - name: Download test bank from build-data release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          gh release download build-data-v1 `
              --repo ${{ github.repository }} `
              --pattern eeg_bank.h5 `
              --dir data/

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cortex.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          cd cortex_app
          pyinstaller --clean --noconfirm cortex.spec

      - name: Zip Windows build
        shell: pwsh
        run: Compress-Archive -Path cortex_app/dist/CORTEX -DestinationPath cortex_app/dist/CORTEX-windows.zip

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: CORTEX-windows
          path: cortex_app/dist/CORTEX-windows.zip

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/cortex-v')
    permissions:
      contents: write
    steps:
      - name: Download Mac artifact
        uses: actions/download-artifact@v4
        with:
          name: CORTEX-mac
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: CORTEX-windows
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            artifacts/CORTEX-mac.dmg
            artifacts/CORTEX-windows.zip
          body: |
            ## CORTEX adaptive EEG certification test

            ### Downloads
            - **macOS:** `CORTEX-mac.dmg` — see "Opening CORTEX on macOS" below
            - **Windows:** `CORTEX-windows.zip` — see "Opening CORTEX on Windows" below

            ### Opening CORTEX on macOS

            CORTEX is not Apple-signed (this is an internal pilot, not a commercial app), so the **first launch needs one-time approval**. On macOS Sequoia and later, Apple removed the inline workaround — you have to authorize it from System Settings.

            1. Open the `.dmg` and drag **CORTEX** to **Applications**.
            2. Double-click **CORTEX** in Applications. macOS shows: *"CORTEX Not Opened — Apple could not verify CORTEX is free of malware..."* Click **Done**.
            3. Open **System Settings → Privacy & Security**. Scroll to the **Security** section near the bottom.
            4. You'll see *"CORTEX was blocked to protect your Mac."* Click **Open Anyway** (enter your password if prompted).
            5. Try opening **CORTEX** again. This time you get a new dialog *with* an **Open** button — click **Open**.
            6. macOS remembers — no further warnings on subsequent launches.

            If you're comfortable with Terminal, this single command also works (skips steps 2–6):

            ```
            xattr -d com.apple.quarantine /Applications/CORTEX.app
            ```

            ### Opening CORTEX on Windows

            1. Extract the `.zip`, open the `CORTEX/` folder, double-click `CORTEX.exe`.
            2. If Windows SmartScreen warns *"Windows protected your PC"*, click **More info** then **Run anyway**. (Only the first launch.)

            ### Requirements

            macOS 12 (Monterey) or later, or Windows 10/11. No Python install needed — everything is bundled.

            ### Reporting bugs

            Anything that crashes, looks visually wrong, is confusing, or feels slow — note it and email the study team. That feedback is the whole point of this internal round.
          draft: false
          prerelease: false

name: CORTEX Release Build

# Runs on macOS + Windows runners to build the standalone CORTEX
# test-taker apps via PyInstaller (cortex_app/cortex.spec), then
# attaches both to a new GitHub Release.
#
# Triggered by:
#   - pushing a tag like  cortex-v1.0,  cortex-v1.1,  cortex-v2.0
#   - manually via the Actions UI ("Run workflow")
#
# Build-time data dependency:
#   data/eeg_bank.h5 (~170 MB) is fetched from the repo's own
#   `build-data-v2` release using GITHUB_TOKEN (no external creds).
#   To refresh the bank: upload the new file to a new release tag
#   (build-data-v2, etc.) and bump the tag reference in the
#   "Download test bank" step below. No AWS interaction in CI.
#
# Required repository secret (Settings -> Secrets and variables ->
# Actions -> New repository secret):
#   CORTEX_CONFIG_YAML
#       -- the full contents of cortex_config.yaml (with Dropbox
#          app_key, app_secret, refresh_token filled in). CI writes
#          this to the repo root before the build.

on:
  push:
    tags:
      - 'cortex-v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage cortex_config.yaml from secret
        env:
          CORTEX_CONFIG_YAML: ${{ secrets.CORTEX_CONFIG_YAML }}
        run: |
          if [ -z "$CORTEX_CONFIG_YAML" ]; then
            echo "ERROR: secret CORTEX_CONFIG_YAML is not set"; exit 1
          fi
          printf '%s' "$CORTEX_CONFIG_YAML" > cortex_config.yaml

      - name: Download test bank from build-data release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download build-data-v3-k7 \
              --repo ${{ github.repository }} \
              --pattern eeg_bank.h5 \
              --dir data/

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cortex.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          cd cortex_app
          pyinstaller --clean --noconfirm cortex.spec

      - name: Create DMG (with /Applications drag-target)
        # The mounted DMG must show CORTEX.app AND an Applications
        # shortcut at the top level so users drag-install rather than
        # double-click in-place. Double-clicking inside the DMG triggers
        # macOS App Translocation — macOS runs the app from a read-only
        # temp copy and CACHES that copy by source-path hash, which
        # silently re-runs old code from later releases launched the
        # same way (and broke v1.0.7 for users who had v1.0 cached).
        run: |
          STAGING=cortex_app/dist/CORTEX-dmg-staging
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R cortex_app/dist/CORTEX.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "CORTEX" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            cortex_app/dist/CORTEX-mac.dmg
          rm -rf "$STAGING"

      - name: Upload Mac DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CORTEX-mac
          path: cortex_app/dist/CORTEX-mac.dmg

  build-mac-intel:
    # Intel (x86_64) mac build, cross-built on the SAME Apple Silicon runner
    # as build-mac, under Rosetta 2. GitHub is retiring the standalone Intel
    # macOS runners (macos-13 sat un-serviced in queue), so instead of
    # depending on one we install a universal2 python.org CPython and drive
    # the whole build through `arch -x86_64`, which yields an x86_64 app +
    # x86_64 ffmpeg. This job is fully independent of build-mac and does NOT
    # change how the arm64 CORTEX-mac.dmg is constructed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Rosetta 2 is present
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Install universal2 CPython 3.11 (python.org)
        # The python.org macos11 installer is universal2 (arm64 + x86_64), so
        # running it under `arch -x86_64` executes its x86_64 slice. The
        # setup-python action only offers an arm64-only build on this runner,
        # which is why we fetch the universal2 framework build directly.
        run: |
          curl -fsSL -O https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg
          sudo installer -pkg python-3.11.9-macos11.pkg -target /
          echo "PYBIN=/Library/Frameworks/Python.framework/Versions/3.11/bin/python3" >> "$GITHUB_ENV"

      - name: Stage cortex_config.yaml from secret
        env:
          CORTEX_CONFIG_YAML: ${{ secrets.CORTEX_CONFIG_YAML }}
        run: |
          if [ -z "$CORTEX_CONFIG_YAML" ]; then
            echo "ERROR: secret CORTEX_CONFIG_YAML is not set"; exit 1
          fi
          printf '%s' "$CORTEX_CONFIG_YAML" > cortex_config.yaml

      - name: Download test bank from build-data release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download build-data-v3-k7 \
              --repo ${{ github.repository }} \
              --pattern eeg_bank.h5 \
              --dir data/

      - name: Create x86_64 venv and install build deps under Rosetta
        # Every command goes through `arch -x86_64`, so the interpreter reports
        # an x86_64 platform and pip resolves x86_64 wheels (numpy, scipy,
        # PyQt6, imageio-ffmpeg all ship them).
        run: |
          arch -x86_64 "$PYBIN" -m venv venv-x86
          arch -x86_64 venv-x86/bin/python -m pip install --upgrade pip
          arch -x86_64 venv-x86/bin/python -m pip install -r requirements-cortex.txt
          arch -x86_64 venv-x86/bin/python -m pip install pyinstaller

      - name: Build with PyInstaller (x86_64)
        run: |
          cd cortex_app
          arch -x86_64 ../venv-x86/bin/python -m PyInstaller --clean --noconfirm cortex.spec

      - name: Verify the built binary is x86_64
        # Hard guard: fail loudly rather than ship an arm64 binary under the
        # Intel filename if the cross-build silently fell back to native arch.
        run: |
          BIN=$(ls cortex_app/dist/CORTEX.app/Contents/MacOS/ | head -1)
          ARCHS=$(lipo -archs "cortex_app/dist/CORTEX.app/Contents/MacOS/$BIN")
          echo "built archs: $ARCHS"
          case "$ARCHS" in
            *x86_64*) echo "ok: contains x86_64";;
            *) echo "ERROR: expected x86_64, got '$ARCHS'"; exit 1;;
          esac

      - name: Create DMG (with /Applications drag-target)
        # Same translocation-avoidance rationale as the Apple Silicon job:
        # the mounted DMG shows CORTEX.app plus an Applications shortcut so
        # users drag-install rather than double-click in-place.
        run: |
          STAGING=cortex_app/dist/CORTEX-dmg-staging
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R cortex_app/dist/CORTEX.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "CORTEX" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            cortex_app/dist/CORTEX-mac-intel.dmg
          rm -rf "$STAGING"

      - name: Upload Mac Intel DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CORTEX-mac-intel
          path: cortex_app/dist/CORTEX-mac-intel.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage cortex_config.yaml from secret
        env:
          CORTEX_CONFIG_YAML: ${{ secrets.CORTEX_CONFIG_YAML }}
        shell: pwsh
        run: |
          if (-not $env:CORTEX_CONFIG_YAML) {
            Write-Error "secret CORTEX_CONFIG_YAML is not set"; exit 1
          }
          Set-Content -Path cortex_config.yaml -Value $env:CORTEX_CONFIG_YAML -NoNewline

      - name: Download test bank from build-data release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          gh release download build-data-v3-k7 `
              --repo ${{ github.repository }} `
              --pattern eeg_bank.h5 `
              --dir data/

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cortex.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          cd cortex_app
          pyinstaller --clean --noconfirm cortex.spec

      - name: Zip Windows build
        shell: pwsh
        run: Compress-Archive -Path cortex_app/dist/CORTEX -DestinationPath cortex_app/dist/CORTEX-windows.zip

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: CORTEX-windows
          path: cortex_app/dist/CORTEX-windows.zip

  build-linux:
    # Pin to ubuntu-22.04 (glibc 2.35) — NOT ubuntu-latest. PyInstaller
    # binaries are dynamically linked against the build machine's glibc;
    # the resulting binary requires glibc >= the build version on the
    # user's machine. 2.35 covers Ubuntu 22.04+, Debian 12+, Fedora 36+,
    # RHEL 9+, Arch (rolling). Building on a newer Ubuntu would break
    # users on those slightly-older distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt6 system libraries
        # PyQt6 wheels bundle Qt itself but link against host Xlib/xcb
        # libraries at runtime. PyInstaller copies what it can detect via
        # ldd into the bundle, but only if the libs are present on the
        # build host. This list is the standard "what does Qt 6 need on
        # Linux" set; safe to install all of them.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 \
            libfontconfig1 libdbus-1-3

      - name: Stage cortex_config.yaml from secret
        env:
          CORTEX_CONFIG_YAML: ${{ secrets.CORTEX_CONFIG_YAML }}
        run: |
          if [ -z "$CORTEX_CONFIG_YAML" ]; then
            echo "ERROR: secret CORTEX_CONFIG_YAML is not set"; exit 1
          fi
          printf '%s' "$CORTEX_CONFIG_YAML" > cortex_config.yaml

      - name: Download test bank from build-data release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download build-data-v3-k7 \
              --repo ${{ github.repository }} \
              --pattern eeg_bank.h5 \
              --dir data/

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cortex.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          cd cortex_app
          pyinstaller --clean --noconfirm cortex.spec

      - name: Tar Linux build
        # tar.gz mirrors the .zip / .dmg pattern of the other two runners.
        # Use a deterministic top-level "CORTEX/" so the user can extract
        # and immediately `./CORTEX/CORTEX` regardless of cwd.
        run: |
          cd cortex_app/dist
          tar czf CORTEX-linux-x86_64.tar.gz CORTEX

      - name: Upload Linux tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: CORTEX-linux
          path: cortex_app/dist/CORTEX-linux-x86_64.tar.gz

  release:
    needs: [build-mac, build-mac-intel, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/cortex-v')
    permissions:
      contents: write
    steps:
      - name: Download Mac artifact
        uses: actions/download-artifact@v4
        with:
          name: CORTEX-mac
          path: artifacts/

      - name: Download Mac Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: CORTEX-mac-intel
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: CORTEX-windows
          path: artifacts/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: CORTEX-linux
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            artifacts/CORTEX-mac.dmg
            artifacts/CORTEX-mac-intel.dmg
            artifacts/CORTEX-windows.zip
            artifacts/CORTEX-linux-x86_64.tar.gz
          body: |
            ## CORTEX

            This is the desktop test taker for our adaptive EEG certification project. You answer a sequence of EEG questions, and an adaptive engine decides what to ask you next based on how you have done so far. The test runs entirely on your computer and uploads only the result CSVs to our Dropbox folder when you finish.

            ### What the test does

            We give you EEG recordings and ask you to classify them. The test covers 7 tasks: a binary spike vs no spike question (Yes / No) for short spike clips, and a 6 way pattern classification for longer IIIC recordings (Seizure, LPD, GPD, LRDA, GRDA, Other).

            The engine is adaptive. It uses an MCMC (Sequential Monte Carlo) particle cloud to track your skill on each task in real time, and at every step it picks the question that will reduce its uncertainty about you the fastest. It stops asking about a task once it has enough evidence to say PASS, FAIL, or REFER for that task with confidence, then moves on. Spike questions come first as a block. When the engine has resolved the spike task, or has used up all the spike recordings, it transitions to the IIIC block. The final results screen shows a verdict for each of the 7 tasks.

            Sessions typically run between 150 and 280 questions depending on how clearly your answers separate from the cut score on each task. Confident raters finish faster; borderline raters trigger more questions.

            ### What is new in v1.3.0

            More polish on the visualization videos the app makes at the end of a session. The graphs now hold still while they play: each one is sized once to fit all of its data, so the plots no longer shift or rescale from moment to moment and nothing ever runs off the edge. The question-difficulty graph in the engine video gains a light grey line connecting your questions in order, so the difficulty path is easy to follow. And the titles and labels across all three videos have been tidied up to read cleanly and professionally. The test itself, the questions, and your verdicts are unchanged.

            The Intel and Apple Silicon mac downloads are both still here: `CORTEX-mac.dmg` for Apple Silicon and `CORTEX-mac-intel.dmg` for Intel. Pick the one that matches your Mac (the Downloads section below explains how to tell). Windows and Linux are unchanged.

            ### If you downloaded an earlier v1.2.x

            Earlier builds in the v1.2 line had a few issues that this build resolves. If you took a session on v1.2.0 through v1.2.4, your results CSVs are still safe in `Dropbox/Apps/CORTEX/results/v1.2.0/`, but the spike portion of those sessions may have been incomplete (v1.2.0 never asked spike questions) or the visualization videos may be missing (v1.2.4). Please re-download and run the test again on v1.3.0 if you can spare 10 to 15 minutes; otherwise just send any feedback you have and we will work with what we have.

            ### Downloads

            * macOS, Apple Silicon (M1 or newer): `CORTEX-mac.dmg`. See "Opening CORTEX on macOS" below.
            * macOS, Intel: `CORTEX-mac-intel.dmg`. See "Opening CORTEX on macOS" below.
            * Windows: `CORTEX-windows.zip`. See "Opening CORTEX on Windows" below.
            * Linux: `CORTEX-linux-x86_64.tar.gz`. See "Opening CORTEX on Linux" below.

            Not sure which Mac you have? Click the Apple menu in the top left corner and choose About This Mac. If you see a "Chip" line with an Apple M name, download the Apple Silicon DMG. If you see a "Processor" line with an Intel name, download the Intel DMG. The Apple Silicon download will not open on an Intel Mac, so this choice matters.

            ### System requirements

            * macOS 12 Monterey or newer. We provide separate downloads for Apple Silicon and Intel Macs; download the one that matches your chip.
            * Windows 10 or Windows 11 (64 bit).
            * Linux with glibc 2.35 or newer. That covers Ubuntu 22.04 and later, Debian 12 and later, Fedora 36 and later, RHEL 9 and later, and current Arch.
            * About 700 MB of free disk space for the installed app plus the bundled test bank.
            * An internet connection to upload results at the end of the session. The test itself runs offline.

            You do not need Python installed. Everything the test needs is bundled inside the installer.

            ### Opening CORTEX on macOS

            Because we are not yet shipping a signed build (this is an internal pilot, not a public release), macOS will warn you the first time you launch it. The warning is normal and goes away after the one time approval.

            Important: drag CORTEX to your Applications folder before you open it. Do not double click CORTEX from inside the disk image window. macOS quietly runs apps from a downloaded location inside a read only "translocated" copy and caches that copy. Old cached copies sometimes get re-run even after you download a fixed update. Installing to Applications avoids this.

            1. Double click the DMG you downloaded (`CORTEX-mac.dmg` for Apple Silicon, `CORTEX-mac-intel.dmg` for Intel). A window opens showing a CORTEX icon on the left and an Applications shortcut on the right.
            2. Drag the CORTEX icon onto the Applications shortcut. Do not open CORTEX from inside this disk image window.
            3. Eject the disk image. In Finder, click the small arrow next to "CORTEX" in the sidebar.
            4. Open your Applications folder and double click CORTEX.
            5. macOS shows "CORTEX Not Opened. Apple could not verify CORTEX is free of malware". Click Done.
            6. Open System Settings, then Privacy and Security, then scroll down to the Security section.
            7. You will see "CORTEX was blocked to protect your Mac". Click Open Anyway. macOS will ask for your password.
            8. Open CORTEX from Applications again. This time you get a new dialog with an Open button. Click Open.
            9. macOS remembers your approval. No warnings on subsequent launches.

            If you are comfortable with Terminal, this single command also clears the quarantine flag after dragging the app to Applications and skips steps 5 through 8:

            ```
            xattr -d com.apple.quarantine /Applications/CORTEX.app
            ```

            ### Opening CORTEX on Windows

            1. Right click `CORTEX-windows.zip` and choose Extract All. Pick a folder you can find again (Documents is fine).
            2. Open the extracted `CORTEX/` folder.
            3. Double click `CORTEX.exe`.
            4. The first time you launch, Windows SmartScreen may show "Windows protected your PC". Click More info, then Run anyway. Only the first launch.

            If your IT policy blocks unsigned executables and SmartScreen does not give you a Run anyway button, please email the study team and we will work around it.

            ### Opening CORTEX on Linux

            Open a terminal in the folder where the tarball is and run:

            ```
            tar xzf CORTEX-linux-x86_64.tar.gz
            ./CORTEX/CORTEX
            ```

            You can also extract the tarball with your file manager and double click the `CORTEX` executable inside the extracted folder. Most desktop environments will run it as a binary on first double click.

            The Linux build is x86_64 only. The visualization videos that render at the end of a session use ffmpeg. The app bundles its own copy via imageio-ffmpeg, so you do not normally need to install ffmpeg yourself. If the videos do not generate, install your distro's ffmpeg package as a fallback: `sudo apt install ffmpeg` on Debian or Ubuntu, `sudo dnf install ffmpeg` on Fedora or RHEL, `sudo pacman -S ffmpeg` on Arch. Sessions complete cleanly without ffmpeg, just without the visualization MP4s.

            ### Reporting bugs

            Anything that crashes, looks visually wrong, is confusing, or feels too slow: please note what you saw and email the study team. That feedback is the whole point of this internal round. If the test froze on you, include the question number it froze on and roughly how far in (5 minutes? 20?). That helps a lot.
          draft: false
          prerelease: false

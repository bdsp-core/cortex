name: CORTEX Web CI

# Fast, self-contained test gate for the browser port (cortex_web/): the
# TypeScript engine + frontend unit tests (vitest) and the FastAPI backend
# tests (pytest). Does NOT run the headless-Chrome UI smoke (needs a browser)
# or the heavy 282-test Python engine suite — those stay local/manual.
#
# Trigger scope is deliberately conservative: pull requests touching
# cortex_web/, plus manual dispatch. It does NOT run on every push to main, so
# it won't generate noise on unrelated commits. Flip to `push:` once verified.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cortex_web/**"
      - ".github/workflows/cortex-web-ci.yml"

defaults:
  run:
    working-directory: cortex_web

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"   # ui-smoke is local-only; no browser in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r server/requirements.txt
      - run: python -m pytest server/test_server.py -q

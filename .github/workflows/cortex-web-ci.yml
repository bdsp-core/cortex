name: CORTEX Web CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cortex_web/**"
      - ".github/workflows/cortex-web-ci.yml"
  push:
    branches: [main]
    paths:
      - "cortex_web/**"
      - ".github/workflows/cortex-web-ci.yml"

concurrency:
  group: cortex-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: cortex_web

jobs:
  quality:
    name: Complete quality and Chromium release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CORTEX_QUALITY_PYTHON: python
      CORTEX_PY: python
      CORTEX_BROWSER_GATES: "1"
      CORTEX_SMOKE_SYNTHETIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: npm
          cache-dependency-path: cortex_web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cortex_web/services/api/requirements.lock
      - name: Install locked dependencies
        run: |
          npm ci
          python -m pip install -r services/api/requirements.lock
          npx playwright install --with-deps chromium
      - name: Run complete quality gate
        run: npm run quality

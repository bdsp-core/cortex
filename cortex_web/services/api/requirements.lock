# Exact prod dependency pins — the reproducibility complement to
# requirements.txt (which keeps the floor constraints for CI + humans).
# deploy_app.sh installs from THIS file when present, so a redeploy always
# reproduces the same environment instead of drifting with upstream releases.
#
# Regenerate after editing requirements.txt:
#   python3 -m venv /tmp/cortex-lockenv
#   /tmp/cortex-lockenv/bin/pip install -r services/api/requirements.txt
#   /tmp/cortex-lockenv/bin/pip freeze > services/api/requirements.lock   (re-add this header)

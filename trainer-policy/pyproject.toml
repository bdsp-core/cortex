[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-trainer-policy"
version = "1.1.0"
description = "Auditable Python representation of the deployed CORTEX trainer policy"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
calibration = [
  "jax>=0.4",
  "numpyro>=0.13",
]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["trainer_policy*"]

[tool.setuptools.package-data]
trainer_policy = ["artifacts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

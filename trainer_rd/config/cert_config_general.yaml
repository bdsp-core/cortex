# ── cert_config v15: credentialed ell* recalibration (COMPLETE — full spec 2026-06-11) ──
# v15 RELEASE = credentialed ell* + corr_t prior (t-block Corr_l→Corr_t) +
# n_particles=1200 (N is the PARTICLE COUNT, not a question budget; stopping
# rule unchanged: n_min=20, R_star=0.30, alpha=0.05, Z=2.0, ESS frac=0.5).
# STAGED, opt-in; live instrument frozen at v14 cuts / Corr_l t-block / 600
# particles for the in-flight tiered-pilot cohort. Full data per
# v15_simulation_spec.txt (recomputed 2026-06-11; replaces the earlier
# 3-decimal partial block).
#
# Validation summary (ablation, synthetic raters through the live SMC):
#   * ell* recalibration is the dominant lever: isolated dPASS@+0.6 =
#     +17.4pp vs shipped v14 (~80% of the full-v15 +21.4pp gain) AND

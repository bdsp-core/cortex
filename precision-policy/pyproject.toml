[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-precision-policy"
version = "0.1.0"
description = "Standalone frozen PrecisionPolicy for CORTEX"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../termination-policy/src"]
testpaths = ["tests"]
